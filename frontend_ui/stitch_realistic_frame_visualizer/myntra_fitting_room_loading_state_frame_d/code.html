<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Digital Fitting Room - Processing</title>
<!-- Tailwind CSS v3 CDN with plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style data-purpose="custom-animations">
    @keyframes pulse-subtle {
      0%, 100% { opacity: 0.95; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.02); }
    }
    @keyframes scan-beam {
      0% { top: 0%; opacity: 0.2; }
      50% { opacity: 0.85; }
      100% { top: 100%; opacity: 0.2; }
    }
    @keyframes bounce-delay {
      0%, 80%, 100% { transform: scale(0.75); opacity: 0.4; }
      40% { transform: scale(1.15); opacity: 1; }
    }
    .scanner-line {
      animation: scan-beam 2.8s ease-in-out infinite alternate;
    }
    .dot-1 { animation: bounce-delay 1.4s infinite ease-in-out; }
    .dot-2 { animation: bounce-delay 1.4s infinite ease-in-out 0.2s; }
    .dot-3 { animation: bounce-delay 1.4s infinite ease-in-out 0.4s; }
  </style>
<style data-purpose="custom-theme">
    /* Subtle theme adjustments matching slate-blue backdrop */
    .bg-fitting-slate {
      background-color: #6c7c8c;
    }
    .bg-fitting-dark {
      background-color: #273443;
    }
    .border-card-subtle {
      border-color: rgba(255, 255, 255, 0.25);
    }
  </style>
</head>
<body class="bg-gray-900 flex justify-center items-center min-h-screen p-0 sm:p-4 select-none font-sans antialiased text-slate-100">
<!-- BEGIN: Mobile Device Frame -->
<div class="relative w-full max-w-[412px] h-[100dvh] max-h-[890px] bg-fitting-slate flex flex-col justify-between overflow-hidden shadow-2xl rounded-none sm:rounded-[44px] border-0 sm:border-[8px] sm:border-slate-800" data-purpose="mobile-container">
<!-- BEGIN: Top Bar & Header -->
<header class="pt-6 sm:pt-7 px-5 pb-3 flex items-center justify-between z-10" data-purpose="top-navigation">
<!-- Back navigation button -->
<button aria-label="Go Back" class="p-2 -ml-2 text-slate-900/80 hover:text-slate-950 transition-colors focus:outline-none" type="button">
<svg class="w-6 h-6 stroke-[2.4]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Screen Title -->
<h1 class="text-base sm:text-lg font-bold tracking-tight text-slate-900/90 text-center">
        Digital Fitting Room
      </h1>
<!-- Close icon button -->
<button aria-label="Close" class="p-2 -mr-2 text-slate-900/80 hover:text-slate-950 transition-colors focus:outline-none" type="button">
<svg class="w-6 h-6 stroke-[2.4]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</header>
<!-- END: Top Bar & Header -->
<!-- BEGIN: Scanning & Holographic Display Area -->
<main class="flex-1 flex flex-col items-center justify-center px-6 -mt-2" data-purpose="main-scanning-display">
<!-- 3D Avatar Scanner Viewport Card -->
<div class="relative w-44 h-56 rounded-xl overflow-hidden border border-white/30 shadow-lg shadow-slate-900/20 bg-slate-800/60 flex items-center justify-center" data-purpose="scanner-hologram-card">
<!-- Holographic 3D Image of digital avatar scanning -->
<img alt="3D Holographic Digital Avatar Scanning" class="w-full h-full object-cover object-center filter brightness-105 contrast-110" src="https://lh3.googleusercontent.com/aida/AEtjO1WWk3Yt0M8t9ridG0QioVeqmlg6nbHlmMyF04Nl0yJBc-PvZIsDXXbduSAAo7UHGWB_pQsXvnhzkcbdS3IPR5Ic3mcR52LdXhOcl2t3FYAYj9c0nhKCxX3QMmByri1w-WYZ66lyR5IztUCOZJE--J7JkZTiOr9xmwPuXQ5zyDzAWusqs6kB-Uc3AHcw-aduTHqZnVSxXzxEYAzPb9Ld6pALg6P4KgOkRx3KfxWZIy9Dvk486tUN-y0Ypg"/>
<!-- Scanning Ray Overlay Line -->
<div class="scanner-line absolute left-0 right-0 h-[2px] bg-cyan-300 shadow-[0_0_12px_#38bdf8] pointer-events-none"></div>
<!-- Cyber Corner Accents -->
<div class="absolute top-1 left-1 w-2 h-2 border-t-2 border-l-2 border-cyan-400 opacity-80"></div>
<div class="absolute top-1 right-1 w-2 h-2 border-t-2 border-r-2 border-cyan-400 opacity-80"></div>
<div class="absolute bottom-1 left-1 w-2 h-2 border-b-2 border-l-2 border-cyan-400 opacity-80"></div>
<div class="absolute bottom-1 right-1 w-2 h-2 border-b-2 border-r-2 border-cyan-400 opacity-80"></div>
</div>
<!-- Mini Horizontal Base Indicator -->
<div class="mt-4 w-28 h-[3px] bg-slate-400/40 rounded-full overflow-hidden">
<div class="w-12 h-full bg-slate-200/70 rounded-full mx-auto"></div>
</div>
<!-- Primary Status Headline -->
<h2 class="mt-5 text-[17px] font-bold text-slate-100 tracking-normal text-center drop-shadow-sm">
        Scanning your measurements...
      </h2>
<!-- Secondary Status Text -->
<p class="mt-1 text-[13px] font-medium text-slate-300/90 text-center tracking-wide">
        Rendering fabric drape in 3D
      </p>
<!-- Processing Progress Bar Container (65%) -->
<div class="w-56 h-[7px] bg-slate-600/70 rounded-full mt-4 overflow-hidden shadow-inner" data-purpose="progress-container">
<!-- Lilac Lavender Gradient Progress Bar Fill at 65% -->
<div class="h-full w-[65%] bg-gradient-to-r from-indigo-300 via-purple-300 to-violet-400 rounded-full shadow-[0_0_8px_rgba(196,181,253,0.5)]"></div>
</div>
<!-- Detailed Percentage Subtext -->
<p class="mt-3 text-[13px] font-medium text-slate-200 tracking-wide text-center">
        65% — Applying Floral Wrap Dress
      </p>
<!-- Dynamic Loading Status Dots -->
<div class="flex items-center gap-1.5 mt-3.5" data-purpose="animated-indicators">
<span class="dot-1 w-2 h-2 bg-indigo-900 rounded-sm inline-block"></span>
<span class="dot-2 w-2 h-2 bg-slate-500 rounded-sm inline-block"></span>
<span class="dot-3 w-2 h-2 bg-slate-500 rounded-sm inline-block"></span>
</div>
</main>
<!-- END: Scanning & Holographic Display Area -->
<!-- BEGIN: Bottom Summary Sheet -->
<footer class="bg-fitting-dark pt-5 pb-7 px-5 rounded-t-2xl shadow-2xl flex flex-col gap-4 border-t border-slate-700/50" data-purpose="bottom-sheet">
<!-- Section Introductory Text -->
<p class="text-xs font-normal text-slate-300 tracking-wide">
        While you wait...
      </p>
<!-- Current Processing Item Summary Card -->
<div class="flex items-start gap-3" data-purpose="product-info-card">
<!-- Purple Vertical Accent Line -->
<div class="w-1 self-stretch bg-purple-700 rounded-full my-0.5"></div>
<!-- Product Specs & Discount Details -->
<div class="flex flex-col items-start gap-1">
<h3 class="text-sm font-bold text-white tracking-tight">
            Floral Printed Wrap Dress
          </h3>
<p class="text-xs font-medium text-slate-300">
            H&amp;M • Size S • ₹ 1,499
          </p>
<!-- Offer Badge Tag -->
<span class="mt-1 px-2.5 py-0.5 bg-emerald-700/80 text-emerald-100 text-[11px] font-bold rounded-full tracking-wider uppercase">
            40% OFF
          </span>
</div>
</div>
<!-- Action Button: Cancel Operation -->
<button class="mt-2 w-full py-2.5 px-4 bg-transparent border border-slate-400 hover:border-slate-200 text-white font-semibold text-sm rounded-lg tracking-wide hover:bg-white/5 active:bg-white/10 transition-all duration-150 focus:outline-none" data-purpose="cancel-action-button" type="button">
        Cancel
      </button>
</footer>
<!-- END: Bottom Sheet -->
</div>
<!-- END: Mobile Device Frame -->
</body></html>
