    input[type=range]:focus {
      outline: none;

      -webkit-appearance: none;
      height: 18px;
      width: 18px;
      border-radius: 50%;
      background: #c084fc;
      cursor: pointer;
      margin-top: -6px;
      box-shadow: 0 0 6px rgba(0,0,0,0.4);
    }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 6px;
      cursor: pointer;
      background: #475569;
      border-radius: 9999px;
    }

<style data-purpose="layout-tweaks">

      -webkit-tap-highlight-color: transparent;

<!-- END: Top AppBar -->
<!-- BEGIN: Segmented Tabs -->

<!-- Subtle Gradient Overlay for visual blending -->

</svg>

<!-- BEGIN: Measurement Controls Drawer -->
<section class="flex-1 bg-[#1e2733] px-5 pt-4 pb-6 flex flex-col justify-between" data-purpose="measurement-controls">
<div class="space-y-4">
<!-- Section Title -->
<h2 class="text-base font-bold text-white tracking-tight">Your Measurements</h2>
<!-- Height Slider Control -->
<div class="space-y-1.5" data-purpose="height-control">
<div class="flex justify-between items-center text-sm">

<span class="bg-[#4338ca] text-indigo-100 text-xs font-semibold px-3 py-0.5 rounded-full shadow-sm" id="height-val">165 cm</span>

</div>
</div>
<!-- Skin Tone Selector Control -->

<div class="flex justify-between items-center text-sm">

<span class="bg-[#4338ca] text-indigo-100 text-xs font-semibold px-3 py-0.5 rounded-full shadow-sm" id="weight-val">Medium</span>

<div class="relative flex items-center">

  <option value="Fair">Fair</option>
  <option value="Light">Light</option>
  <option value="Medium" selected>Medium</option>
  <option value="Olive">Olive</option>
  <option value="Tan">Tan</option>
  <option value="Dark">Dark</option>
</select>
</div>
</div>
<!-- Body Shape Selector Grid -->
<div class="space-y-2 pt-1" data-purpose="body-shape-selection">
<label class="block text-sm font-medium text-slate-300">Body Shape</label>
<div class="grid grid-cols-4 gap-2">
<!-- Hourglass (Active) -->
<button class="body-shape-btn py-2 text-xs font-medium rounded-md bg-[#24174d] text-indigo-200 border border-indigo-500/80 shadow-inner text-center transition-all" data-selected="true" type="button">

<!-- Pear -->
<button class="body-shape-btn py-2 text-xs font-medium rounded-md bg-[#334155]/60 text-slate-300 border border-slate-600/70 hover:bg-slate-700/60 text-center transition-all" data-selected="false" type="button">
                Pear

<!-- Apple -->
<button class="body-shape-btn py-2 text-xs font-medium rounded-md bg-[#334155]/60 text-slate-300 border border-slate-600/70 hover:bg-slate-700/60 text-center transition-all" data-selected="false" type="button">
                Apple

<!-- Rectangle -->
<button class="body-shape-btn py-2 text-xs font-medium rounded-md bg-[#334155]/60 text-slate-300 border border-slate-600/70 hover:bg-slate-700/60 text-center transition-all" data-selected="false" type="button">

</div>

<!-- Primary Action Button -->
<div class="pt-5" data-purpose="cta-container">
<button id="generate-avatar-btn" class="w-full py-3.5 px-4 rounded-xl bg-[#231557] hover:bg-[#2b1870] active:scale-[0.99] border border-indigo-700/40 text-indigo-200 font-semibold text-sm flex items-center justify-center gap-2 shadow-lg transition-all duration-150" type="button">

<!-- BEGIN: Interactive Sliders & Shape Toggles Script -->
<script data-purpose="interactive-controls">
    document.addEventListener('DOMContentLoaded', () => {
      // Height slider update
      const heightSlider = document.getElementById('height-slider');
      const heightVal = document.getElementById('height-val');
      if (heightSlider && heightVal) {
        heightSlider.addEventListener('input', (e) => {
          heightVal.textContent = `${e.target.value} cm`;
        });
      }

      // Weight slider update
      const weightSlider = document.getElementById('weight-slider');
      const weightVal = document.getElementById('weight-val');
      if (weightSlider && weightVal) {
        weightSlider.addEventListener('input', (e) => {
          weightVal.textContent = `${e.target.value} kg`;
        });
      }

      // Body shape buttons selection state
      const shapeButtons = document.querySelectorAll('.body-shape-btn');
      shapeButtons.forEach(btn => {
        btn.addEventListener('click', () => {
          shapeButtons.forEach(b => {
            b.className = "body-shape-btn py-2 text-xs font-medium rounded-md bg-[#334155]/60 text-slate-300 border border-slate-600/70 hover:bg-slate-700/60 text-center transition-all";
            b.setAttribute('data-selected', 'false');
          });
          btn.className = "body-shape-btn py-2 text-xs font-medium rounded-md bg-[#24174d] text-indigo-200 border border-indigo-500/80 shadow-inner text-center transition-all";
          btn.setAttribute('data-selected', 'true');
        });
      });
    });
  </script>
<!-- BEGIN: API Integration Script (Mode A) -->
<script data-purpose="api-integration">
  document.addEventListener('DOMContentLoaded', () => {
    const generateBtn = document.getElementById('generate-avatar-btn');
    const heightSlider = document.getElementById('height-slider');
    const weightSlider = document.getElementById('weight-slider');
    const viewportSection = document.querySelector('[data-purpose="avatar-viewport"]');
    
    // Fallback vector loading state (inline SVG)
    const loadingStateHTML = `
      <div class="absolute inset-0 flex flex-col items-center justify-center bg-[#1e2733] z-50">
        <svg class="w-16 h-16 text-indigo-500 animate-pulse" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 4v16m8-8H4" />
          <!-- Abstract wireframe representation -->
          <circle cx="12" cy="7" r="3" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 10v6a3 3 0 006 0v-6" />
        </svg>
        <p class="text-indigo-300 font-medium text-sm mt-4 tracking-wide animate-bounce">Generating 3D Mesh...</p>
      </div>
    `;

    if (generateBtn) {
      generateBtn.addEventListener('click', async () => {
        // 1. Show fallback vector loading state (3-second timeout constraint handling)
        const originalViewportContent = viewportSection.innerHTML;
        viewportSection.innerHTML = loadingStateHTML + originalViewportContent;
        
        // 2. Gather parameters
        const height = heightSlider ? heightSlider.value : 175;
        const weight = weightSlider ? weightSlider.value : 70;
        const activeShapeBtn = document.querySelector('.body-shape-btn[data-selected="true"]');
        const bodyShape = activeShapeBtn ? activeShapeBtn.innerText.trim().toLowerCase() : 'hourglass';
        
        const formData = new FormData();
        formData.append('height', height);
        formData.append('weight', weight);
        formData.append('body_shape', bodyShape);

        try {
          // 3. Initiate API Call to Gateway
          const response = await fetch('https://digital-try-on-1.onrender.com/mode-a/generate', {
            method: 'POST',
            body: formData
          });
          
          const data = await response.json();
          if (data.task_id) {
            pollTaskStatus(data.task_id, originalViewportContent);
          } else {
            throw new Error("No task ID returned");
          }
        } catch (error) {
          console.error("API Error:", error);
          alert("Could not connect to the backend GPU clusters. (Is Docker running?)");
          viewportSection.innerHTML = originalViewportContent; // Restore on error
        }
      });
    }

    // 4. Polling Mechanism
    async function pollTaskStatus(taskId, originalContent) {
      const pollInterval = setInterval(async () => {
        try {
          const res = await fetch(`https://digital-try-on-1.onrender.com/tasks/${taskId}`);
          const data = await res.json();
          
          if (data.status === "SUCCESS") {
            clearInterval(pollInterval);
            // Simply swap the placeholder image with the real generated image!
            const avatarImg = document.getElementById("avatar-image");
            if (avatarImg) {
              avatarImg.src = data.result.mesh_url;
              avatarImg.classList.remove("object-cover");
              avatarImg.classList.add("object-contain", "bg-slate-900");
            }
            
            // Re-enable button
            const genBtn = document.getElementById('generate-btn');
            genBtn.innerHTML = '✨ Avatar Generated!';
            genBtn.classList.remove('opacity-70', 'cursor-not-allowed', 'animate-pulse');
          } else if (data.status === "FAILURE") {
            clearInterval(pollInterval);
            alert("Backend processing failed.");
            viewportSection.innerHTML = originalContent;
          }
        } catch (err) {
          console.error("Polling error", err);
          clearInterval(pollInterval);
          viewportSection.innerHTML = originalContent;
        }
      }, 1000); // Poll every 1 second
    }
  });
</script>
<!-- END: API Integration Script (Mode A) -->
</body></html>
