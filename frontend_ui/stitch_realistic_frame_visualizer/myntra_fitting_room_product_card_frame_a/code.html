<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Myntra - Digital Fitting Room</title>
<!-- Tailwind CSS CDN with forms and container queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            app: {
              bg: '#1e293b',
              surface: '#273549',
              dark: '#182230',
              accentTeal: '#00a884',
              accentPurple: '#2d1b69',
              accentAmber: '#f59e0b'
            }
          }
        }
      }
    }
  </script>
<!-- Custom styles for layout and micro-details -->
<style data-purpose="custom-layout">
    /* iOS frame simulation & smooth scroll styling */
    body {
      background-color: #0f172a;
      -webkit-font-smoothing: antialiased;
    }
    .custom-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .custom-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-0 sm:p-4 text-slate-100 font-sans selection:bg-teal-500 selection:text-white">
<!-- BEGIN: MobileFrameContainer -->
<div class="w-full sm:max-w-[400px] h-[100dvh] sm:h-[844px] bg-[#273549] sm:rounded-[44px] shadow-2xl flex flex-col overflow-hidden relative border border-slate-700/40" data-purpose="mobile-frame">
<!-- BEGIN: TopBar -->
<header class="w-full bg-[#33445b] px-4 pt-11 pb-3 flex items-center justify-between border-b border-slate-700/30 shrink-0 z-20">
<!-- Back Arrow -->
<button aria-label="Go back" class="p-1 text-slate-300 hover:text-white transition-colors" type="button">
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2.2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M10 19l-7-7m0 0l7-7m-7 7h18" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Centered Screen Title -->
<h1 class="text-base font-bold text-slate-100 tracking-wide">Wishlist</h1>
<!-- Bookmark/Wishlist Icon Right -->
<button aria-label="Bookmark action" class="p-1 text-slate-300 hover:text-white transition-colors" type="button">
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M12 8.5c-.75-1-2.25-1-2.25.5 0 1.5 2.25 2.5 2.25 2.5s2.25-1 2.25-2.5c0-1.5-1.5-1.5-2.25-.5z" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"></path>
</svg>
</button>
</header>
<!-- END: TopBar -->
<!-- BEGIN: ScrollableContent -->
<main class="flex-1 overflow-y-auto custom-scrollbar flex flex-col">
<!-- BEGIN: HeroProductImageSection -->
<div class="relative w-full aspect-[4/5] max-h-[430px] bg-[#1e2a38] overflow-hidden flex items-center justify-center shrink-0" data-purpose="product-image-container">
<!-- Replaced image placeholder with provided high-res model photograph -->
<img alt="Indian woman wearing H&amp;M navy floral printed wrap dress" class="w-full h-full object-cover object-top brightness-[0.98] contrast-[1.02]" src="https://lh3.googleusercontent.com/aida/AEtjO1Wlykj3Loi3Ii-EZYc7xrxFXdahYGSw2alm7biju1J5AVSB9ZapkePSBwBluPXPkfhzuqCEnWVXMPo5JpKri6s_V4ohBxU_j36vhJ3n3LUyNN5wCUNNXmHjuj37bxI0DA06IkQPfdUfTLwpnULr8JI2W_k9yzq5UvI6KqdEi7uDsC1x3GcYns-EOBLk_MwWQgjyNO7FpRwBy5VfZtZwmprsQzvu8GS_-dycx2m4W8T4F_NHHVNtAUMftCw"/>
<!-- Overlay Floating Badges -->
<div class="absolute bottom-3 left-3 z-10">
<span class="inline-flex items-center px-3 py-1 rounded-full text-[11px] font-bold tracking-wider uppercase bg-white/95 text-slate-900 shadow-md">
            MYNTRA
          </span>
</div>
<div class="absolute bottom-3 right-3 z-10">
<span class="inline-flex items-center px-2.5 py-1 rounded-full text-[11px] font-bold tracking-wide bg-[#00a884] text-white shadow-md">
            40% OFF
          </span>
</div>
</div>
<!-- END: HeroProductImageSection -->
<!-- BEGIN: ProductDetailsSection -->
<section class="p-4 flex-1 flex flex-col justify-between space-y-4 bg-[#273549]" data-purpose="product-details">
<!-- Metadata & Price Block -->
<div class="space-y-1.5">
<!-- Brand and Category -->
<div class="text-xs font-semibold text-slate-300 tracking-wide">
            H&amp;M • Ethnic Wear
          </div>
<!-- Product Name -->
<h2 class="text-xl font-extrabold text-white tracking-tight leading-snug">
            Floral Printed Wrap Dress
          </h2>
<!-- Pricing Row -->
<div class="flex items-center gap-2.5 pt-0.5">
<span class="text-xl font-black text-white tracking-tight">₹ 1,499</span>
<span class="text-sm font-medium text-slate-400 line-through">₹ 2,499</span>
<span class="text-[11px] font-bold bg-[#008767] text-white px-2 py-0.5 rounded-full">
              40% OFF
            </span>
</div>
</div>
<!-- Size Selection -->
<div class="space-y-2" data-purpose="size-selector">
<span class="block text-xs font-bold text-slate-200 uppercase tracking-wide">Select Size</span>
<div class="flex items-center gap-2">
<!-- Size: XS -->
<button class="w-10 h-10 rounded border border-slate-500 bg-[#34465d] text-slate-200 text-xs font-bold hover:border-slate-400 flex items-center justify-center transition-all" type="button">
              XS
            </button>
<!-- Size: S (Selected) -->
<button class="w-10 h-10 rounded border-2 border-slate-300 bg-[#506887] text-white text-xs font-black shadow flex items-center justify-center transition-all" type="button">
              S
            </button>
<!-- Size: M -->
<button class="w-10 h-10 rounded border border-slate-500 bg-[#34465d] text-slate-200 text-xs font-bold hover:border-slate-400 flex items-center justify-center transition-all" type="button">
              M
            </button>
<!-- Size: L -->
<button class="w-10 h-10 rounded border border-slate-500 bg-[#34465d] text-slate-200 text-xs font-bold hover:border-slate-400 flex items-center justify-center transition-all" type="button">
              L
            </button>
</div>
</div>
<!-- Digital Fitting Room Callout Link -->
<a class="inline-flex items-center text-xs font-bold text-amber-400 hover:text-amber-300 transition-colors py-0.5" data-purpose="fitting-room-callout" href="#digital-fitting-room">
<span>Size unsure? → Use the Digital Fitting Room</span>
</a>
<!-- Dual CTA Actions -->
<div class="grid grid-cols-2 gap-3 pt-1" data-purpose="actions">
<!-- Add to Bag Button -->
<button class="w-full py-3.5 px-3 rounded-lg border-2 border-slate-300 bg-transparent text-white font-bold text-sm tracking-wide hover:bg-slate-700/40 active:scale-[0.98] transition-all flex items-center justify-center" type="button">
            Add to Bag
          </button>
<!-- Try It On Button (Fitting Room Primary Action) -->
<button class="w-full py-3.5 px-3 rounded-lg bg-[#271464] border border-indigo-500/40 text-purple-200 hover:text-white font-bold text-sm tracking-wide shadow-lg hover:bg-[#341b80] active:scale-[0.98] transition-all flex items-center justify-center gap-1.5" type="button">
<!-- Icon: User / Sparkle -->
<svg class="w-4 h-4 text-purple-300" fill="currentColor" viewbox="0 0 20 20" xmlns="http://www.w3.org/2000/svg">
<path clip-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" fill-rule="evenodd"></path>
</svg>
<span class="text-amber-400 text-xs">✦</span>
<span class="text-white font-semibold">Try It On</span>
</button>
</div>
</section>
<!-- END: ProductDetailsSection -->
</main>
<!-- END: ScrollableContent -->
<!-- BEGIN: BottomNavigation -->
<nav aria-label="Bottom Navigation" class="w-full bg-[#202d3f] border-t border-slate-700/40 px-6 py-3.5 flex items-center justify-between shrink-0 z-20" data-purpose="bottom-nav">
<!-- Nav Item 1: Catalog/Cards -->
<button aria-label="Catalog" class="text-slate-300 hover:text-white transition-colors" type="button">
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<rect height="16" rx="2" width="14" x="5" y="4"></rect>
<circle cx="12" cy="10" r="2.5"></circle>
<path d="M8 17c0-1.8 1.8-2.5 4-2.5s4 .7 4 2.5"></path>
</svg>
</button>
<!-- Nav Item 2: Wishlist (Active) -->
<button aria-label="Saved Items" class="text-slate-300 hover:text-white transition-colors" type="button">
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M12 9c-.5-1-1.8-1-1.8.4 0 1.2 1.8 2.1 1.8 2.1s1.8-.9 1.8-2.1c0-1.4-1.3-1.4-1.8-.4z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Nav Item 3: Digital Fitting Room / Camera Scanner -->
<button aria-label="Fitting Camera" class="text-slate-300 hover:text-white transition-colors" type="button">
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" stroke-linecap="round" stroke-linejoin="round"></path>
<circle cx="12" cy="13" r="3.5"></circle>
</svg>
</button>
<!-- Nav Item 4: User Profile -->
<button aria-label="Profile" class="text-slate-300 hover:text-white transition-colors" type="button">
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<rect height="16" rx="2" width="16" x="4" y="4"></rect>
<circle cx="12" cy="10" r="2.5"></circle>
<path d="M8 17c0-1.8 1.8-2.5 4-2.5s4 .7 4 2.5"></path>
</svg>
</button>
</nav>
<!-- END: BottomNavigation -->
</div>
<!-- END: MobileFrameContainer -->
</body></html>
